name: Publish Pages (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: '受け入れ検証完了後、publish と入力して公開する'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, lint, test and build
        run: npm run check
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Production PWA acceptance tests
        run: npm run test:pwa
      - name: Upload validated static output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
